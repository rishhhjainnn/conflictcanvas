<!-- Projects Page Template -->
<div id="projects-page" class="page">
  <div class="main-layout">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-left">
        <div class="navbar-logo">
          <div class="navbar-logo-icon">
            <i data-lucide="layers"></i>
          </div>
          ConflictCanvas
        </div>
        <div class="navbar-search">
          <i data-lucide="search" class="navbar-search-icon"></i>
          <input type="text" placeholder="Search projects...">
        </div>
      </div>
      <div class="navbar-right">
        <button class="navbar-icon-btn" onclick="demo.start()">
          <i data-lucide="play"></i>
          <span class="badge">DEMO</span>
        </button>
        <button class="navbar-icon-btn">
          <i data-lucide="bell"></i>
          <span class="badge">3</span>
        </button>
        <div class="navbar-profile">
          <div class="avatar avatar-sm avatar-online">R</div>
          <div class="navbar-profile-info">
            <span class="navbar-profile-name">Rishi</span>
            <span class="navbar-profile-email">rishi@demo.com</span>
          </div>
        </div>
      </div>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-title">Main</div>
        <nav class="sidebar-nav">
          <a href="#/dashboard" class="sidebar-nav-item">
            <i data-lucide="layout-dashboard"></i>
            Dashboard
          </a>
          <a href="#/projects" class="sidebar-nav-item active">
            <i data-lucide="folder"></i>
            Projects
          </a>
          <a href="#/tasks" class="sidebar-nav-item">
            <i data-lucide="check-square"></i>
            Tasks
          </a>
          <a href="#/conflicts" class="sidebar-nav-item">
            <i data-lucide="alert-triangle"></i>
            Conflicts
            <span class="badge badge-danger">2</span>
          </a>
          <a href="#/activity" class="sidebar-nav-item">
            <i data-lucide="clock"></i>
            Activity
          </a>
        </nav>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">Team</div>
        <div class="sidebar-users">
          <div class="sidebar-user">
            <div class="sidebar-user-avatar">
              <div class="avatar avatar-sm avatar-online">R</div>
              <div class="sidebar-user-status online"></div>
            </div>
            <div class="sidebar-user-info">
              <div class="sidebar-user-name">Rishi</div>
              <div class="sidebar-user-task">Authentication API</div>
            </div>
          </div>
          <div class="sidebar-user">
            <div class="sidebar-user-avatar">
              <div class="avatar avatar-sm avatar-online">V</div>
              <div class="sidebar-user-status online"></div>
            </div>
            <div class="sidebar-user-info">
              <div class="sidebar-user-name">Vansh</div>
              <div class="sidebar-user-task">Dashboard UI</div>
            </div>
          </div>
          <div class="sidebar-user">
            <div class="sidebar-user-avatar">
              <div class="avatar avatar-sm">N</div>
              <div class="sidebar-user-status offline"></div>
            </div>
            <div class="sidebar-user-info">
              <div class="sidebar-user-name">Nitya</div>
              <div class="sidebar-user-task">Offline</div>
            </div>
          </div>
          <div class="sidebar-user">
            <div class="sidebar-user-avatar">
              <div class="avatar avatar-sm avatar-online">A</div>
              <div class="sidebar-user-status online"></div>
            </div>
            <div class="sidebar-user-info">
              <div class="sidebar-user-name">Aashish</div>
              <div class="sidebar-user-task">WebSocket</div>
            </div>
          </div>
        </div>
      </div>

      <button class="sidebar-demo-btn" onclick="demo.start()">
        <i data-lucide="play"></i>
        Try Live Conflict Demo
      </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Projects</h1>
        <p class="page-subtitle">Manage your projects and track progress</p>
        <div class="page-actions">
          <button class="btn btn-secondary">
            <i data-lucide="filter"></i>
            Filter
          </button>
          <button class="btn btn-primary" onclick="projects.showCreateModal()">
            <i data-lucide="plus"></i>
            New Project
          </button>
        </div>
      </div>

      <!-- Filters -->
      <div class="projects-filters">
        <div class="filter-group">
          <input type="text" class="search-input" placeholder="Search projects...">
        </div>
        <div class="filter-group">
          <span class="filter-label">Status:</span>
          <select class="filter-select">
            <option value="all">All Status</option>
            <option value="active">Active</option>
            <option value="completed">Completed</option>
            <option value="archived">Archived</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">Priority:</span>
          <select class="filter-select">
            <option value="all">All Priority</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>

      <!-- Projects Grid -->
      <div class="projects-grid" id="projects-container">
        <!-- Projects will be dynamically loaded here -->
      </div>
    </main>
  </div>
</div>
